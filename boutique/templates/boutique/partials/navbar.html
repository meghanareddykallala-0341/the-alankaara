
{% load static %}

<header class="navbar">
    <a href="{% url 'home' %}" class="brand">
        <img
            src="{% static 'images/logo.png' %}"
            alt="THE ALANKAARA logo"
            class="brand-logo"
        >
        <span class="brand-name">THE ALANKAARA</span>
    </a>

    <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'all_collections' %}">Collections</a>
        
        <a href="{% url 'style_studio' %}">Style Studio</a>
        
        <a href="{% url 'cart' %}">My Bag 🛍️</a>

        
{% if user.is_authenticated %}
<span class="nav-welcome">
    Welcome, {{ user.first_name|default:user.username }}
</span>
{% else %}
<a href="{% url 'login' %}">Login</a>
<a href="{% url 'register' %}">Register</a>
{% endif %}

{% if user.is_authenticated %}
<form method="post" action="{% url 'logout' %}" class="nav-auth-form">
    {% csrf_token %}
    <button type="submit" class="nav-auth-button">Logout</button>
</form>
{% endif %}


    </nav>
</header>
